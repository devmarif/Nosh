# Docker Compose Configuration
# Defines the backend service, its build settings, environment variables,
# port mapping, network, and restart policy.

services:
  backend:
    image: nosh:v1
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .env
    ports:
      - "5000:5000"
    networks:
      - NOSH-Network
    restart: unless-stopped

networks:
  NOSH-Network:
    driver: bridge